# Optional NVIDIA GPU access for CastNexus.
# Requires NVIDIA Container Toolkit on the Docker host.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-nvidia.yml up -d
#
# CastNexus probes h264_nvenc before using it and automatically falls back to
# CPU x264 if the driver/runtime/encoder probe fails. Music 24/7 is embedded in
# the dashboard service, so the same GPU grant covers the radio compositor too.
services:
  dashboard:
    gpus: all
    environment:
      # The NVIDIA Container Toolkit only mounts the NVENC/NVDEC libraries
      # when the "video" capability is requested. Its default
      # (compute,utility) makes h264_nvenc fail its probe inside the container
      # and CastNexus would silently fall back to CPU x264.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
