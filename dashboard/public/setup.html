<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CastNexus Setup</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .setup-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 500px;
      padding: 40px;
    }
    .setup-header { text-align: center; margin-bottom: 30px; }
    .setup-header h1 { margin: 0 0 8px; color: #333; font-size: 28px; }
    .setup-header p { margin: 0; color: #999; font-size: 14px; }
    .step { margin-bottom: 22px; padding: 18px; border: 1px solid #eee; border-radius: 8px; }
    .step h3 { margin: 0 0 8px; font-size: 15px; color: #333; }
    .step p { margin: 0 0 12px; font-size: 13px; color: #777; }
    .step.done { border-color: #35d07f; background: #f3fbf7; }
    .status-pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: #eee; color: #666; }
    .status-pill.ok { background: #d8f5e6; color: #1c9a5b; }
    button, a.button {
      display: inline-block;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      background: #667eea;
      color: white;
    }
    button:hover, a.button:hover { background: #5568d3; }
    button.secondary, a.button.secondary { background: #f0f0f0; color: #333; }
    button.secondary:hover, a.button.secondary:hover { background: #e0e0e0; }
    .note { font-size: 12px; color: #999; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="setup-header">
      <h1>CastNexus Setup</h1>
      <p>Connect your accounts through the CastNexus OAuth broker. No client IDs or secrets are ever entered here.</p>
    </div>
    <div id="steps">Loading…</div>
    <p class="note">Twitch and YouTube sign-in both go through the oauth-broker service - CastNexus never stores your provider client credentials.</p>
  </div>

  <script>
    async function loadStatus() {
      const stepsEl = document.getElementById("steps");
      let status;
      try {
        const res = await fetch("/api/status", { credentials: "same-origin" });
        if (res.status === 401) { status = null; }
        else if (res.ok) { status = await res.json(); }
        else throw new Error("status check failed");
      } catch (err) {
        stepsEl.innerHTML = `<div class="step"><p>Could not check setup status: ${err.message}</p></div>`;
        return;
      }

      if (!status) {
        stepsEl.innerHTML = `
          <div class="step">
            <h3>1. Connect Twitch <span class="status-pill">Required</span></h3>
            <p>Sign in with Twitch through the CastNexus OAuth broker to create your account.</p>
            <a class="button" href="/auth/twitch">Connect Twitch</a>
          </div>`;
        return;
      }

      const sourceDone = !status.needsSourceMode && !status.needsStreamKey;
      let youtube = { connected: false };
      try {
        const yres = await fetch("/api/youtube/status", { credentials: "same-origin" });
        if (yres.ok) youtube = await yres.json();
      } catch { /* optional */ }

      stepsEl.innerHTML = `
        <div class="step done">
          <h3>1. Twitch account <span class="status-pill ok">Connected</span></h3>
          <p>Signed in as <strong>${status.displayName || status.twitchLogin || "your Twitch account"}</strong>.</p>
        </div>
        <div class="step ${sourceDone ? "done" : ""}">
          <h3>2. Source &amp; stream key <span class="status-pill ${sourceDone ? "ok" : ""}">${sourceDone ? "Done" : "Required"}</span></h3>
          <p>Pick your source mode and stream key inside the CastNexus dashboard.</p>
          <a class="button ${sourceDone ? "secondary" : ""}" href="/dashboard">${sourceDone ? "Open dashboard" : "Finish in dashboard"}</a>
        </div>
        <div class="step ${youtube.connected ? "done" : ""}">
          <h3>3. Connect YouTube <span class="status-pill ${youtube.connected ? "ok" : ""}">${youtube.connected ? "Connected" : "Optional"}</span></h3>
          <p>Connect YouTube through the OAuth broker to upload recordings later.</p>
          ${youtube.connected ? "" : '<a class="button" href="/auth/youtube">Connect YouTube</a>'}
        </div>
        <div class="step">
          <a class="button secondary" href="/dashboard">Continue to dashboard →</a>
        </div>`;
    }
    loadStatus();
  </script>
</body>
</html>
