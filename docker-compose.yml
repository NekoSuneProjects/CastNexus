services:
  # --- PS5 mode only: DNS hijack + ARP-spoof/DNAT intercept, so the console's
  # own broadcast is caught without configuring anything on the console beyond
  # its DNS server. Not needed for OBS/streaming-software sources, which push
  # straight to mediamtx below with a normal server URL + stream key. Started
  # only when the "console" profile is active (`docker compose --profile console up -d`).
  dns:
    image: ghcr.io/nekosunevr/consoledns/dns:latest
    container_name: nekosune-ps5-dns
    restart: unless-stopped
    network_mode: host
    profiles: ["console"]
    environment:
      PI_IP: ${PI_IP}
      DNS_UPSTREAM: 1.1.1.1
      DNS_LOG_ALL: "true"
  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    container_name: nekosune-ps5-mediamtx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
  dashboard:
    image: ghcr.io/nekosunevr/consoledns/dashboard:latest
    container_name: nekosune-ps5-dashboard
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - ./dashboard/data:/app/data
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8090}
      PI_IP: ${PI_IP}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:-}
  # --- PS5 mode only (see "dns" above for why). This is the piece that makes
  # console capture reliable, since the real ingest address is often handed to
  # the PS5 directly over HTTPS rather than a fresh DNS lookup that "dns" could
  # catch alone.
  intercept:
    image: ghcr.io/nekosunevr/consoledns/intercept:latest
    container_name: nekosune-ps5-intercept
    network_mode: host
    restart: unless-stopped
    profiles: ["console"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PI_IP: ${PI_IP}
      TARGET_IPS: ${TARGET_IPS}
      GATEWAY_IP: ${GATEWAY_IP}
networks: {}
