services:
  # --- Console capture helpers.
  # LAN: docker compose --profile console up -d
  # VPS/public: use docker-compose.vps.yml with --profile vps-console.
  dns:
    image: ghcr.io/nekosuneprojects/castnexus-dns:${CASTNEXUS_IMAGE_TAG:-latest}
    container_name: castnexus-dns
    restart: unless-stopped
    network_mode: host
    profiles: ["console", "vps-console"]
    environment:
      PI_IP: ${PI_IP}
      DNS_REDIRECT_IP: ${DNS_REDIRECT_IP:-}
      DNS_REDIRECT_IPV6: ${DNS_REDIRECT_IPV6:-}
      DNS_PUBLIC_MODE: ${DNS_PUBLIC_MODE:-false}
      DNS_ALLOWED_CLIENTS: ${DNS_ALLOWED_CLIENTS:-}
      DNS_ALLOW_ANY: ${DNS_ALLOW_ANY:-false}
      DNS_UPSTREAM: ${DNS_UPSTREAM:-1.1.1.1}
      DNS_LOG_ALL: ${DNS_LOG_ALL:-true}

  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    container_name: castnexus-mediamtx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ./dashboard/data/recordings:/recordings

  dashboard:
    image: ghcr.io/nekosuneprojects/castnexus-dashboard:${CASTNEXUS_IMAGE_TAG:-latest}
    container_name: castnexus-dashboard
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - ./dashboard/data:/app/data
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8090}
      PI_IP: ${PI_IP}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:-}
      MEDIAMTX_API: http://127.0.0.1:9997
      MEDIAMTX_PLAYBACK: http://127.0.0.1:9996
      MEDIA_RTMP_ORIGIN: rtmp://127.0.0.1:1935
      RECORDINGS_DIR: /app/data/recordings
      STATE_FILE: /app/data/state.json
      MUSIC_DIR: /app/data/music
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-3600000}
      VOD_MAX_GB: ${VOD_MAX_GB:-20}
      CASTNEXUS_VIDEO_ENCODER: ${CASTNEXUS_VIDEO_ENCODER:-auto}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-/dev/dri/renderD128}
      VOD_X264_PRESET: ${VOD_X264_PRESET:-veryfast}
      VOD_VIDEO_BITRATE: ${VOD_VIDEO_BITRATE:-6000k}
      VOD_VIDEO_MAXRATE: ${VOD_VIDEO_MAXRATE:-6500k}
      VOD_VIDEO_BUFSIZE: ${VOD_VIDEO_BUFSIZE:-12000k}
      VOD_AUDIO_BITRATE: ${VOD_AUDIO_BITRATE:-160k}
      VOD_FPS: ${VOD_FPS:-30}
      MUSIC24_POLL_MS: ${MUSIC24_POLL_MS:-2000}
      MUSIC24_NOW_POLL_MS: ${MUSIC24_NOW_POLL_MS:-750}
      MUSIC24_START_TIMEOUT_MS: ${MUSIC24_START_TIMEOUT_MS:-60000}
      MUSIC24_EMBED_START_DELAY_MS: ${MUSIC24_EMBED_START_DELAY_MS:-500}
      # .env.example documents these as valid overrides but they were never
      # forwarded into the container, so setting them had no effect.
      MUSIC24_WIDTH: ${MUSIC24_WIDTH:-1920}
      MUSIC24_HEIGHT: ${MUSIC24_HEIGHT:-1080}
      MUSIC24_FPS: ${MUSIC24_FPS:-30}
      CASTNEXUS_PI_SAFE_MODE: ${CASTNEXUS_PI_SAFE_MODE:-auto}
      CASTNEXUS_PI_SAFE_WIDTH: ${CASTNEXUS_PI_SAFE_WIDTH:-960}
      CASTNEXUS_PI_SAFE_HEIGHT: ${CASTNEXUS_PI_SAFE_HEIGHT:-540}
      CASTNEXUS_PI_SAFE_FPS: ${CASTNEXUS_PI_SAFE_FPS:-20}
      CASTNEXUS_PI_JPEG_QUALITY: ${CASTNEXUS_PI_JPEG_QUALITY:-60}
      # CPU_* aliases take priority over PI_* in rtmp-pipeline.js's safeRenderConfig
      # (same clamp, newer name - also covers CPU-only x64/VPS hosts, not just Pi).
      CASTNEXUS_CPU_SAFE_WIDTH: ${CASTNEXUS_CPU_SAFE_WIDTH:-}
      CASTNEXUS_CPU_SAFE_HEIGHT: ${CASTNEXUS_CPU_SAFE_HEIGHT:-}
      CASTNEXUS_CPU_SAFE_FPS: ${CASTNEXUS_CPU_SAFE_FPS:-}
      CASTNEXUS_CPU_JPEG_QUALITY: ${CASTNEXUS_CPU_JPEG_QUALITY:-}
      RTMP_INPUT_QUEUE: ${RTMP_INPUT_QUEUE:-1024}
      DESTINATION_AUDIO_BITRATE: ${DESTINATION_AUDIO_BITRATE:-128k}
      DESTINATION_AUDIO_RATE: ${DESTINATION_AUDIO_RATE:-44100}
      COVER_LOOKUP_PROVIDERS: ${COVER_LOOKUP_PROVIDERS:-musicbrainz,itunes}
      COVER_LOOKUP_TIMEOUT_MS: ${COVER_LOOKUP_TIMEOUT_MS:-5000}
      COVER_LOOKUP_CACHE_HOURS: ${COVER_LOOKUP_CACHE_HOURS:-168}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      YOUTUBE_UPLOAD_ALLOWLIST: ${YOUTUBE_UPLOAD_ALLOWLIST:-}
      YOUTUBE_UPLOAD_DAILY_SOFT_LIMIT: ${YOUTUBE_UPLOAD_DAILY_SOFT_LIMIT:-90}
      CASTNEXUS_CHANNEL: ${CASTNEXUS_CHANNEL:-stable}
      # Official hosted OAuth keeps Twitch/Google client secrets out of user
      # installations. Set this blank to use local BYO credentials instead.
      CASTNEXUS_OAUTH_BROKER_URL: ${CASTNEXUS_OAUTH_BROKER_URL-https://castnexus.nekosunevr.co.uk/oauth}

  intercept:
    image: ghcr.io/nekosuneprojects/castnexus-intercept:${CASTNEXUS_IMAGE_TAG:-latest}
    container_name: castnexus-intercept
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    profiles: ["console", "vps-console"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      INTERCEPT_MODE: ${INTERCEPT_MODE:-lan}
      PI_IP: ${PI_IP}
      TARGET_IPS: ${TARGET_IPS:-}
      GATEWAY_IP: ${GATEWAY_IP:-}
      VPS_ALLOWED_CLIENTS: ${VPS_ALLOWED_CLIENTS:-}
      VPS_ALLOW_ANY: ${VPS_ALLOW_ANY:-false}
      VPS_RTMP_PORT: ${VPS_RTMP_PORT:-1935}
      VPS_RTMP_WAIT_SECONDS: ${VPS_RTMP_WAIT_SECONDS:-60}

networks: {}
