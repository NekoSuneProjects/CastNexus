services:
  relaystream-mediamtx:
    image: bluenviron/mediamtx:1.19.2
    container_name: castnexus-relaystream-mediamtx
    restart: unless-stopped
    depends_on:
      - relaystream-api
    ports:
      # RTMP push ingest and WHIP/WHEP/HLS - front these with your reverse
      # proxy (RTMP is usually exposed directly; WHIP/HLS are proxied at
      # /relay and /whip on the public domain).
      - "127.0.0.1:1936:1936"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:8189:8189/tcp"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./relaystream/mediamtx.yml:/mediamtx.yml:ro

  relaystream-api:
    build:
      context: ./relaystream
    image: ghcr.io/nekosuneprojects/castnexus-relaystream:${CASTNEXUS_IMAGE_TAG:-beta}
    container_name: castnexus-relaystream-api
    restart: unless-stopped
    ports:
      # Keep the API private to the host; publish it through the existing
      # HTTPS reverse proxy instead of exposing this port publicly.
      - "127.0.0.1:8092:8092"
    environment:
      RELAYSTREAM_PORT: 8092
      RELAYSTREAM_PUBLIC_URL: https://castnexus.nekosunevr.co.uk
      RELAYSTREAM_SIGNING_SECRET: ${RELAYSTREAM_SIGNING_SECRET:?Generate a random 32+ byte signing secret}
      RELAYSTREAM_ADMIN_TOKEN: ${RELAYSTREAM_ADMIN_TOKEN:?Generate a random admin token to manage/ban nodes}
      RELAYSTREAM_TRUST_PROXY: "true"
      MEDIAMTX_API: http://relaystream-mediamtx:9997
