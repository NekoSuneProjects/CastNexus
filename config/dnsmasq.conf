# NekoSune PS5 DNS Streamer
# This DNS server only hijacks Twitch ingest DNS.
# Everything else is forwarded normally.

no-resolv
server=1.1.1.1
server=1.0.0.1
cache-size=1000
log-queries

# The PS5's Twitch broadcast ingest is redirected to the Pi.
# dnsmasq address rules apply to the domain and its subdomains.
address=/live.twitch.tv/${PI_IP}
address=/contribute.live-video.net/${PI_IP}

# Also cover the common Twitch ingest hostname pattern.
address=/twitch.tv/${PI_IP}
