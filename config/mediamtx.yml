logLevel: info

# ingest from the console/OBS/internal relay
rtmp: yes
rtmpAddress: :1935

# playback protocols - pull the same live stream directly, without going
# through Twitch/YouTube at all. Useful for VRChat, OBS, VLC, etc.
rtsp: yes
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAllowOrigins:
  - '*'

webrtc: yes
webrtcAddress: :8889
# Replace with the address(es) viewers actually use to reach this server -
# your public domain and/or IP, not a LAN placeholder. WebRTC needs this to
# match reality or ICE negotiation fails even though HLS/RTSP still work.
webrtcAdditionalHosts:
  - ps4stream.nekosunevr.co.uk
# A STUN server plus a single fixed UDP port (instead of a random ephemeral
# one per connection) makes this firewall/NAT-forwarding friendly - open
# only this one UDP port rather than a whole range.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcICEUDPMuxAddress: :8189

srt: yes
srtAddress: :8890

# Local-only Control API. CastNexus uses this to toggle recording on exact
# public/<twitch-login> paths and to enumerate/delete recording segments.
api: yes
apiAddress: 127.0.0.1:9997

# Local-only recording playback API. The dashboard authenticates users then
# proxies MP4 playback/downloads instead of exposing this port publicly.
playback: yes
playbackAddress: 127.0.0.1:9996

# Recording is OFF by default. CastNexus hot-patches only the authenticated
# user's stable public/<login> path when they enable recording in the Studio.
pathDefaults:
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordMaxPartSize: 50M
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s

paths:
  all_others:
