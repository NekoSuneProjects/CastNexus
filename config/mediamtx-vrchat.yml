logLevel: info

# VRChat compatibility HLS instance.
#
# The primary MediaMTX instance stays on Low-Latency HLS (:8888) and keeps its
# dual-audio public path (AAC for HLS + Opus for WebRTC). The vrchat-relay
# sidecar selects only H.264 + the first AAC audio track and publishes that
# stream here over a local-only RTSP listener. This instance then remuxes it to
# classic MPEG-TS HLS for Unity / AVPro compatibility.
# No video or audio re-encoding is performed.

# Local-only RTSP ingest used by castnexus-vrchat-relay. TCP-only avoids
# colliding with the primary MediaMTX RTP/RTCP UDP listeners.
rtsp: yes
rtspAddress: 127.0.0.1:8564
rtspTransports: [tcp]

# Disable all other listeners that would collide with the primary host-network
# instance. HLS remains enabled separately below.
rtmp: no
webrtc: no
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no

hls: yes
hlsAddress: :8898
hlsVariant: mpegts
# The AAC-only publisher is continuously present while public/* is live, so the
# MPEG-TS HLS muxer can safely stay warm without the old sourceOnDemand race.
hlsAlwaysRemux: yes
hlsSegmentCount: 6
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50M
hlsAllowOrigins:
  - '*'

paths:
  "~^public/(.+)$":
    source: publisher
    overridePublisher: yes
