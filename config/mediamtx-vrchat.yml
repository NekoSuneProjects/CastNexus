logLevel: info

# VRChat compatibility HLS instance.
#
# The primary MediaMTX instance stays on Low-Latency HLS (:8888). This second
# instance pulls only CastNexus public/* paths from the primary over local RTSP
# and remuxes them to classic MPEG-TS HLS for Unity / AVPro compatibility.
# No video or audio re-encoding is performed here.

# Disable listeners that would collide with the primary host-network instance.
rtmp: no
rtsp: no
webrtc: no
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no

hls: yes
hlsAddress: :8898
hlsVariant: mpegts
# Generate HLS when a client requests a path. This must remain off while the
# upstream RTSP source is sourceOnDemand, otherwise MediaMTX expects an HLS
# muxer before the on-demand source has been started and can return
# "muxer instance not available".
hlsAlwaysRemux: no
hlsSegmentCount: 6
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50M
hlsAllowOrigins:
  - '*'

paths:
  "~^public/(.+)$":
    source: rtsp://127.0.0.1:8554/public/$G1
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 30s
    rtspTransport: tcp
