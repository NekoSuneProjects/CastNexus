# Optional: self-host your OWN oauth-broker instead of using the official
# public one. Only useful if you deliberately want your own Twitch/Google
# developer applications instead of the shared official broker. Merge this
# in alongside the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.oauth-broker.yml up -d
#
# Then point every CastNexus install (Docker/Desktop/CLI) at it by setting
# CASTNEXUS_OAUTH_BROKER_URL to your own https:// public URL for this
# service (e.g. https://your-domain.example/oauth, proxied to :8091). See
# docs/HOSTED-OAUTH.md for the full design.
services:
  oauth-broker:
    image: ghcr.io/nekosuneprojects/castnexus-oauth-broker:${CASTNEXUS_IMAGE_TAG:-latest}
    build:
      context: ./oauth-broker
    container_name: castnexus-oauth-broker
    restart: unless-stopped
    ports:
      # Keep the broker private to the host; publish it through your own
      # HTTPS reverse proxy instead of exposing this port publicly.
      - "127.0.0.1:8091:8091"
    environment:
      OAUTH_BROKER_PORT: 8091
      OAUTH_BROKER_PUBLIC_URL: ${OAUTH_BROKER_PUBLIC_URL:?Your own public https:// URL for this broker, e.g. https://your-domain.example/oauth}
      CASTNEXUS_SITE_URL: ${CASTNEXUS_SITE_URL:-}
      OAUTH_BROKER_SIGNING_SECRET: ${OAUTH_BROKER_SIGNING_SECRET:?Generate a random 32+ byte signing secret}
      OAUTH_TRUST_PROXY: "true"
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?Your own Twitch app client id}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?Your own Twitch app client secret}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:?Your own Google app client id}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:?Your own Google app client secret}
