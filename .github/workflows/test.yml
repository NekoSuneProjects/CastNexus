name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  compose:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        shell: bash
        env:
          PI_IP: 127.0.0.1
          TARGET_IPS: 127.0.0.2
          GATEWAY_IP: 127.0.0.1
          PUBLIC_IP: 203.0.113.55
          VPS_ALLOWED_CLIENTS: 198.51.100.20/32
          OAUTH_BROKER_PUBLIC_URL: https://oauth.example.test/oauth
          OAUTH_BROKER_SIGNING_SECRET: ci-placeholder-secret
          TWITCH_CLIENT_ID: ci-placeholder
          TWITCH_CLIENT_SECRET: ci-placeholder
          YOUTUBE_CLIENT_ID: ci-placeholder
          YOUTUBE_CLIENT_SECRET: ci-placeholder
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.vps.yml --profile vps-console config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.gpu-vaapi.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.gpu-nvidia.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.vrchat-relay.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.oauth-broker.yml config >/dev/null

      - name: Ensure MediaMTX config path is a file, not a stray directory
        shell: bash
        run: |
          # A previous run's Docker bind-mount to a missing path can leave a
          # root-owned directory here, which then shadows the tracked file on
          # this self-hosted runner's reused workspace.
          if [ -d config/mediamtx.yml ]; then
            echo "Removing stray directory at config/mediamtx.yml"
            rm -rf config/mediamtx.yml 2>/dev/null || sudo rm -rf config/mediamtx.yml
            git checkout -- config/mediamtx.yml
          fi

      - name: Boot-test pinned MediaMTX recording config
        shell: bash
        run: |
          set +e
          timeout 5s docker run --rm \
            -v "$PWD/config/mediamtx.yml:/mediamtx.yml:ro" \
            bluenviron/mediamtx:1.19.2 /mediamtx.yml >mediamtx-boot.log 2>&1
          code=$?
          set -e
          cat mediamtx-boot.log
          if [ "$code" -ne 124 ]; then
            echo "MediaMTX exited before the timeout; config is invalid or failed to boot (exit $code)." >&2
            exit 1
          fi
