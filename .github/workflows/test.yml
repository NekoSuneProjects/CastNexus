name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n intercept/intercept.sh

      - name: VPS intercept configuration smoke test
        shell: bash
        run: |
          set -euo pipefail
          INTERCEPT_MODE=vps \
          VPS_ALLOWED_CLIENTS=203.0.113.7/32 \
          INTERCEPT_DRY_RUN=true \
          bash intercept/intercept.sh | tee /tmp/vps-intercept.log
          grep -Fq "dry-run validation passed" /tmp/vps-intercept.log
          if INTERCEPT_MODE=vps INTERCEPT_DRY_RUN=true bash intercept/intercept.sh >/tmp/vps-unsafe.log 2>&1; then
            cat /tmp/vps-unsafe.log
            echo "VPS intercept must reject an accidental unrestricted public RTMP listener." >&2
            exit 1
          fi

  docker:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build intercept image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./intercept
          push: false
          platforms: linux/amd64
          build-args: |
            CASTNEXUS_VERSION=0.0.0-ci
            CASTNEXUS_CHANNEL=dev
            CASTNEXUS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-ci-intercept
          cache-to: type=gha,mode=max,scope=castnexus-ci-intercept

  compose:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        env:
          PI_IP: 127.0.0.1
          TARGET_IPS: 127.0.0.2
          GATEWAY_IP: 127.0.0.1
          VPS_ALLOWED_CLIENTS: 198.51.100.20/32
        run: docker compose --profile console config >/dev/null
