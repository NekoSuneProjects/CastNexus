name: Test

on:
  pull_request:
  push:
    branches: [main, beta, vrchat-relay]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax check
        run: node --check vrchat-relay/vrchat-relay.js

  docker:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build vrchat-relay image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./vrchat-relay
          push: false
          platforms: linux/amd64
          build-args: |
            CASTNEXUS_VERSION=0.0.0-ci
            CASTNEXUS_CHANNEL=dev
            CASTNEXUS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-ci-vrchat-relay
          cache-to: type=gha,mode=max,scope=castnexus-ci-vrchat-relay

  compose:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config >/dev/null

      - name: Ensure MediaMTX config path is a file, not a stray directory
        shell: bash
        run: |
          # A previous run's Docker bind-mount to a missing path can leave a
          # root-owned directory here, which then shadows the tracked file on
          # this self-hosted runner's reused workspace.
          if [ -d config/mediamtx.yml ]; then
            echo "Removing stray directory at config/mediamtx.yml"
            rm -rf config/mediamtx.yml 2>/dev/null || sudo rm -rf config/mediamtx.yml
            git checkout -- config/mediamtx.yml
          fi

      - name: Boot-test pinned MediaMTX configs
        shell: bash
        run: |
          set +e
          timeout 5s docker run --rm \
            -v "$PWD/config/mediamtx.yml:/mediamtx.yml:ro" \
            bluenviron/mediamtx:1.19.2 /mediamtx.yml >mediamtx-boot.log 2>&1
          code=$?
          set -e
          cat mediamtx-boot.log
          if [ "$code" -ne 124 ]; then
            echo "MediaMTX exited before the timeout; config is invalid or failed to boot (exit $code)." >&2
            exit 1
          fi
