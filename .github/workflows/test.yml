name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dns dependencies
        working-directory: dns
        run: npm install

      - name: Syntax check
        run: node --check dns/server.js

      - name: DNS gateway tests
        working-directory: dns
        run: npm test
