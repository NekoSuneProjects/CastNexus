name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dns dependencies
        working-directory: dns
        run: npm install

      - name: Syntax check
        run: node --check dns/server.js

      - name: DNS gateway tests
        working-directory: dns
        run: npm test

  docker:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build dns image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./dns
          push: false
          platforms: linux/amd64
          build-args: |
            CASTNEXUS_VERSION=0.0.0-ci
            CASTNEXUS_CHANNEL=dev
            CASTNEXUS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-ci-dns
          cache-to: type=gha,mode=max,scope=castnexus-ci-dns

  compose:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        env:
          PI_IP: 127.0.0.1
          PUBLIC_IP: 203.0.113.55
          DNS_ALLOWED_CLIENTS: 198.51.100.20/32
        run: docker compose --profile console config >/dev/null
