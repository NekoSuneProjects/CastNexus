name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --prefer-offline --no-audit

      - name: Syntax check server and browser modules
        shell: bash
        run: |
          set -euo pipefail
          node --check dashboard/server.js
          node --check dashboard/server-entry.js
          node --check dashboard/overlays.js
          node --check dashboard/scenes.js
          node --check dashboard/music-scene.js
          node --check dashboard/music24.js
          node --check dashboard/music-engine.js
          node --check dashboard/profile-music.js
          node --check dashboard/profile-vod.js
          node --check dashboard/profile-rtmp.js
          node --check dashboard/profile-destinations.js
          node --check dashboard/cover-art.js
          node --check dashboard/rtmp-pipeline.js
          node --check dashboard/public-republish-runtime.js
          node --check dashboard/gpu-encoder.js
          node --check dashboard/twitch-api.js
          node --check dashboard/mediamtx-recordings.js
          node --check dashboard/youtube-upload.js
          node --check dashboard/destination-output.js
          node --check dashboard/relay-push.js
          node --check dashboard/compositor.js
          node --check dashboard/hosted-oauth.js
          node --check dashboard/site-pages.js
          node --check dashboard/public/app-brand.js
          node --check dashboard/public/app-core.js
          node --check dashboard/public/destination-presets.js
          node --check dashboard/public/app-modals.js
          node --check dashboard/public/app-music-page.js
          node --check dashboard/public/app-music-ui-fixes.js
          node --check dashboard/public/app-pages-a.js
          node --check dashboard/public/app-pages-b.js
          node --check dashboard/public/app-profile-rtmp.js
          node --check dashboard/public/app-program-routing.js
          node --check dashboard/public/app-runtime.js
          node --check dashboard/public/app-updater.js
          node --check dashboard/public/app-vod.js

      - name: Hosted OAuth broker-client tests
        run: |
          node --test dashboard/hosted-oauth.test.js
          node --test dashboard/site-pages.test.js

      - name: Embedded dashboard + Music 24/7 runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/castnexus-entry.log
          STATE=/tmp/castnexus-entry-state.json
          rm -f "$LOG" "$STATE"
          DASHBOARD_PORT=18090 \
          STATE_FILE="$STATE" \
          MUSIC_DIR=/tmp/castnexus-entry-music \
          MEDIAMTX_API=http://127.0.0.1:19997 \
          node dashboard/server-entry.js >"$LOG" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          http_ready=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18090/ >/dev/null 2>&1; then http_ready=1; break; fi
            sleep .25
          done
          worker_ready=0
          for i in $(seq 1 20); do
            if grep -Fq "[music24] watching" "$LOG"; then worker_ready=1; break; fi
            sleep .25
          done
          cat "$LOG"
          test "$http_ready" -eq 1
          test "$worker_ready" -eq 1

      - name: CPU-only Chromium compositor regression test
        run: node --test dashboard/compositor.test.js

      - name: Persistent encrypted login session tests
        run: node --test dashboard/persistent-session-store.test.js

      - name: Public RTMP republish regression test
        run: node --test dashboard/public-republish-runtime.test.js

      - name: Destination platform preset tests
        run: node --test dashboard/destination-presets.test.js

      - name: Destination push ffmpeg argv (RTMP/WHIP) smoke test
        run: node --test dashboard/destination-output.test.js

      - name: relaystream push registration + token cache smoke test
        run: node --test dashboard/relay-push.test.js

      - name: Program Scene routing regression test
        run: node --test dashboard/program-scene-routing.test.js

      - name: Profile music isolation + dual-format smoke test
        run: node --test dashboard/profile-music.test.js

      - name: Music playlist advancement regression test
        run: node --test dashboard/music-engine.test.js

      - name: Profile RTMP isolation smoke test
        run: node --test dashboard/profile-rtmp.test.js

      - name: Profile destination isolation smoke test
        run: node --test dashboard/profile-destinations.test.js

      - name: Music 24/7 embeddable worker smoke test
        run: node --test dashboard/music24-module.test.js

      - name: Music 24/7 Program Scene regression test
        run: node --test dashboard/music24-program-scene.test.js

      - name: Cover artwork fallback smoke test
        run: node --test dashboard/cover-art.test.js

      - name: Pi-safe RTMP pipeline smoke test
        run: node --test dashboard/rtmp-pipeline.test.js

      - name: Twitch HLS + VOD resolver smoke test
        run: node --test dashboard/profile-vod.test.js

      - name: GPU encoder selection smoke test
        run: node --test dashboard/gpu-encoder.test.js

      - name: Twitch API discovery smoke test
        run: node --test dashboard/twitch-api.test.js

      - name: MediaMTX recording storage smoke test
        run: node --test dashboard/mediamtx-recordings.test.js

      - name: YouTube upload guard smoke test
        run: node --test dashboard/youtube-upload.test.js
