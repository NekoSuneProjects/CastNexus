name: Test

on:
  pull_request:
  push:
    branches: [main, beta, desktopapp]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install electron dependencies
        working-directory: electron
        run: npm install --prefer-offline --no-audit

      - name: Syntax check
        run: |
          set -euo pipefail
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/download-manager.js
          node --check electron/ffmpeg-selector.js

      - name: Electron FFmpeg compatibility tests
        run: node --test electron/ffmpeg-selector.test.js
