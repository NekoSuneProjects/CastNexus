name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install oauth-broker dependencies
        working-directory: oauth-broker
        run: npm install --prefer-offline --no-audit

      - name: Syntax check
        run: node --check oauth-broker/server.js

      - name: OAuth broker tests
        run: node --test oauth-broker/server.test.js

  docker:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build oauth-broker image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./oauth-broker
          push: false
          platforms: linux/amd64
          build-args: |
            CASTNEXUS_VERSION=0.0.0-ci
            CASTNEXUS_CHANNEL=dev
            CASTNEXUS_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-ci-oauth-broker
          cache-to: type=gha,mode=max,scope=castnexus-ci-oauth-broker

  compose:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        env:
          OAUTH_BROKER_SIGNING_SECRET: ci-placeholder-secret
          TWITCH_CLIENT_ID: ci-placeholder
          TWITCH_CLIENT_SECRET: ci-placeholder
          YOUTUBE_CLIENT_ID: ci-placeholder
          YOUTUBE_CLIENT_SECRET: ci-placeholder
        run: docker compose config >/dev/null
