name: Test

on:
  pull_request:
  push:
    branches: [main, beta]

jobs:
  ci:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: bash -n intercept/intercept.sh

      - name: VPS intercept configuration smoke test
        shell: bash
        run: |
          set -euo pipefail
          INTERCEPT_MODE=vps \
          VPS_ALLOWED_CLIENTS=203.0.113.7/32 \
          INTERCEPT_DRY_RUN=true \
          bash intercept/intercept.sh | tee /tmp/vps-intercept.log
          grep -Fq "dry-run validation passed" /tmp/vps-intercept.log
          if INTERCEPT_MODE=vps INTERCEPT_DRY_RUN=true bash intercept/intercept.sh >/tmp/vps-unsafe.log 2>&1; then
            cat /tmp/vps-unsafe.log
            echo "VPS intercept must reject an accidental unrestricted public RTMP listener." >&2
            exit 1
          fi
