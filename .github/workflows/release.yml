name: CastNexus Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - beta
          - stable
        default: beta
      version:
        description: Version (example 1.2.0 or 1.2.0-beta.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: castnexus-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MEDIAMTX_VERSION: v1.19.2

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      docker_tag: ${{ steps.meta.outputs.docker_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" == *-* ]]; then CHANNEL=beta; else CHANNEL=stable; fi
          else
            VERSION="${INPUT_VERSION#v}"
            CHANNEL="${INPUT_CHANNEL}"
            if [[ "$CHANNEL" == "beta" && "$VERSION" != *-* ]]; then
              VERSION="${VERSION}-beta.${GITHUB_RUN_NUMBER}"
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [[ "$CHANNEL" == "stable" && "$VERSION" == *-* ]]; then
            echo "Stable releases cannot use a prerelease version: $VERSION" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "$CHANNEL" == "stable" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Stable releases must be dispatched from the main branch." >&2
            exit 1
          fi

          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$CHANNEL" == "beta" ]]; then
            DOCKER_TAG=beta
            PRERELEASE=true
          else
            DOCKER_TAG=latest
            PRERELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

          echo "CastNexus $VERSION ($CHANNEL)"

  docker:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [dashboard, dns, intercept]
    steps:
      - uses: actions/checkout@v7

      - name: Stamp CastNexus web build
        shell: bash
        run: |
          cat > dashboard/public/build-info.js <<EOF
          window.CASTNEXUS_BUILD = Object.freeze({
            name: "CastNexus",
            version: "${{ needs.meta.outputs.version }}",
            channel: "${{ needs.meta.outputs.channel }}",
            installType: "docker",
            repository: "${{ github.repository }}"
          });
          EOF

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CastNexus ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CASTNEXUS_VERSION=${{ needs.meta.outputs.version }}
            CASTNEXUS_CHANNEL=${{ needs.meta.outputs.channel }}
            CASTNEXUS_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/castnexus-${{ matrix.service }}:${{ needs.meta.outputs.docker_tag }}
            ghcr.io/${{ needs.meta.outputs.owner }}/castnexus-${{ matrix.service }}:${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=CastNexus ${{ matrix.service }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=castnexus-${{ matrix.service }}

  desktop:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            artifact: CastNexus-Windows-x64
          - os: ubuntu-latest
            target: linux-x64
            artifact: CastNexus-Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Stamp CastNexus desktop build
        shell: node {0}
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          REPOSITORY: ${{ github.repository }}
        run: |
          const fs = require("fs");
          const info = { name:"CastNexus", version:process.env.VERSION, channel:process.env.CHANNEL, installType:"desktop", repository:process.env.REPOSITORY };
          fs.writeFileSync("desktop/build-info.json", JSON.stringify(info, null, 2) + "\n");
          fs.writeFileSync("dashboard/public/build-info.js", `window.CASTNEXUS_BUILD = Object.freeze(${JSON.stringify(info)});\n`);

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --omit=dev

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install

      - name: Build CastNexus executable
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/CastNexus"
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then OUT="${OUT}.exe"; fi
          npx pkg . --targets "node18-${{ matrix.target }}" --output "$OUT"

      - name: Download desktop runtime tools (Windows)
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null

          $mtx = "https://github.com/bluenviron/mediamtx/releases/download/${{ env.MEDIAMTX_VERSION }}/mediamtx_${{ env.MEDIAMTX_VERSION }}_windows_amd64.zip"
          Invoke-WebRequest -Uri $mtx -OutFile mediamtx.zip
          Expand-Archive -Path mediamtx.zip -DestinationPath bundle -Force

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile bundle/yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive -Path deno.zip -DestinationPath bundle -Force

          & bundle/yt-dlp.exe --version
          & bundle/deno.exe --version

      - name: Download desktop runtime tools (Linux)
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle

          mtx="https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          curl -fL "$mtx" -o mediamtx.tar.gz
          tar -xzf mediamtx.tar.gz -C bundle

          curl -fL "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux" -o bundle/yt-dlp
          curl -fL "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip" -o deno.zip
          unzip -o deno.zip -d bundle
          chmod +x bundle/mediamtx bundle/yt-dlp bundle/deno

          bundle/yt-dlp --version
          bundle/deno --version

      - name: Assemble Windows bundle
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item desktop/dist/CastNexus.exe out/CastNexus.exe
          Copy-Item bundle/mediamtx.exe out/mediamtx.exe
          Copy-Item bundle/yt-dlp.exe out/yt-dlp.exe
          Copy-Item bundle/deno.exe out/deno.exe
          Copy-Item desktop/README.md out/README.md
          Compress-Archive -Path out/* -DestinationPath CastNexus-Windows-x64.zip -Force

      - name: Assemble Linux bundle
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp desktop/dist/CastNexus out/CastNexus
          cp bundle/mediamtx out/mediamtx
          cp bundle/yt-dlp out/yt-dlp
          cp bundle/deno out/deno
          cp desktop/README.md out/README.md
          chmod +x out/CastNexus out/mediamtx out/yt-dlp out/deno
          tar -czf CastNexus-Linux-x64.tar.gz -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            CastNexus-Windows-x64.zip
            CastNexus-Linux-x64.tar.gz
          if-no-files-found: ignore

  release:
    needs: [meta, docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download desktop release artifacts only
        uses: actions/download-artifact@v8
        with:
          pattern: CastNexus-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/CastNexus-Windows-x64.zip
          test -f release-assets/CastNexus-Linux-x64.tar.gz
          echo "Release assets:"
          ls -lh release-assets

      - name: Write release channel notes
        shell: bash
        run: |
          cat > release-intro.md <<EOF
          ## CastNexus ${{ needs.meta.outputs.version }}

          **Channel:** ${{ needs.meta.outputs.channel }}

          ### Included builds
          - Docker: `castnexus-dashboard`, `castnexus-dns`, `castnexus-intercept`
          - Docker channel tag: `${{ needs.meta.outputs.docker_tag }}`
          - Windows x64 desktop bundle
          - Linux x64 desktop bundle
          - Desktop runtime tools: MediaMTX, yt-dlp nightly and Deno

          ### Updating
          - Stable Docker: `CASTNEXUS_IMAGE_TAG=latest CASTNEXUS_CHANNEL=stable docker compose pull && docker compose up -d`
          - Beta Docker: `CASTNEXUS_IMAGE_TAG=beta CASTNEXUS_CHANNEL=beta docker compose pull && docker compose up -d`
          - Desktop: download the new bundle below. CastNexus also checks this release feed and notifies when a newer build is available.

          ### Reruns / VOD
          Twitch live HLS relay, Twitch VOD reruns, YouTube VOD/past-livestream URLs and uploaded rerun videos are profile-scoped. Remote content should only be used when you own it or have permission to relay/rerun it. YouTube URL resolving is most reliable from a normal home/residential network; CastNexus does not request browser cookies and falls back to manual video upload when YouTube presents a sign-in/bot challenge.

          GitHub's generated notes below list the code changes included since the previous release.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CastNexus ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.channel == 'stable' }}
          generate_release_notes: true
          body_path: release-intro.md
          files: |
            release-assets/CastNexus-Windows-x64.zip
            release-assets/CastNexus-Linux-x64.tar.gz
