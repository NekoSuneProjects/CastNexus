name: VRChat Relay Image

on:
  push:
    branches:
      - vrchat-relay
    paths:
      - "vrchat-relay/**"
      - ".github/workflows/vrchat-relay-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v4

      - name: Read version from main
        id: version
        run: echo "value=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push VRChat relay
        uses: docker/build-push-action@v6
        with:
          context: ./vrchat-relay
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CASTNEXUS_VERSION=${{ steps.version.outputs.value }}
            CASTNEXUS_CHANNEL=dev
            CASTNEXUS_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/nekosuneprojects/castnexus-vrchat-relay:latest
            ghcr.io/nekosuneprojects/castnexus-vrchat-relay:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.title=CastNexus VRChat Relay
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-vrchat-relay
          cache-to: type=gha,mode=max,scope=castnexus-vrchat-relay
