name: Publish Docker Image

on:
  push:
    branches: [oauth-broker]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker-publish:
    runs-on: [self-hosted, Linux, docker, buildx]
    steps:
      - uses: actions/checkout@v4
      - name: Read version from main
        id: version
        run: echo "value=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync package.json/package-lock.json to this version
        run: npm version "${{ steps.version.outputs.value }}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version
      - name: Commit version bump if it changed anything
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync version to ${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Version already up to date."
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push oauth-broker image
        uses: docker/build-push-action@v6
        with:
          context: ./oauth-broker
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CASTNEXUS_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/nekosuneprojects/castnexus-oauth-broker:latest
            ghcr.io/nekosuneprojects/castnexus-oauth-broker:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.title=CastNexus oauth-broker
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-oauth-broker
          cache-to: type=gha,mode=max,scope=castnexus-oauth-broker
