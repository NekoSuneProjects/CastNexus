name: Publish CLI Binaries

on:
  push:
    branches: [cli]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: [self-hosted, Linux, docker, buildx]
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from main
        id: version
        run: echo "value=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync package.json/package-lock.json to this version
        run: npm version "${{ steps.version.outputs.value }}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version
      - name: Commit version bump if it changed anything
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync version to ${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Version already up to date."
          fi

  build-cli:
    needs: meta
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: [self-hosted, Linux, docker, buildx]
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dashboard
          path: _dashboard-branch
      - name: Place dashboard app for bundling
        shell: bash
        run: cp -r _dashboard-branch/dashboard dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # dashboard's node_modules is gitignored, so the fetched copy has none -
      # without this pkg fails to bundle it ("Cannot find module 'express'").
      - run: npm --prefix dashboard install --omit=dev
      - run: npm --prefix cli install
      - name: Build CLI binary
        working-directory: cli
        run: npm run pkg:build
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            cli/dist/castnexus-cli*
