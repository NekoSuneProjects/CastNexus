name: Publish Desktop Build

on:
  push:
    branches: [desktopapp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: [self-hosted, Linux, docker, buildx]
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: v${{ steps.version.outputs.value }}
      release_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from main
        id: version
        run: echo "value=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync package.json/package-lock.json to this version
        run: npm version "${{ steps.version.outputs.value }}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version
      - name: Commit version bump if it changed anything
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync version to ${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Version already up to date."
          fi
      - name: Check if a release already exists for this version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ steps.version.outputs.value }}")
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.value }} already exists - will skip publishing, only building."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-electron:
    needs: meta
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: [self-hosted, Linux, docker, buildx]
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dashboard
          path: _dashboard-branch
      - name: Place dashboard app for bundling
        shell: bash
        run: cp -r _dashboard-branch/dashboard dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        # xz-utils matters here beyond just .tar.xz support: without a real
        # `xz` on PATH, fpm falls back to invoking the bundled app-builder
        # binary as a tar compressor via `-I'<path>'`, but that quoting
        # assumes shell execution - electron-builder spawns it without a
        # shell, so the literal quote characters end up in argv and tar
        # fails with "cannot execute". A real xz avoids that fallback.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils fakeroot xz-utils
      # dashboard's node_modules is gitignored, so the fetched copy has none -
      # without this the packaged app fails at startup with "Cannot find
      # module 'express'".
      - run: npm --prefix dashboard install --omit=dev
      - run: npm --prefix electron install
      - name: Build Electron
        working-directory: electron
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.target }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb

  publish-release:
    needs: [meta, build-electron]
    if: needs.meta.outputs.release_exists == 'false'
    runs-on: [self-hosted, Linux, docker, buildx]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: electron-win
          path: electron-win
      - uses: actions/download-artifact@v4
        with:
          name: electron-linux
          path: electron-linux
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: CastNexus Desktop ${{ needs.meta.outputs.version }}
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            electron-win/*.exe
            electron-linux/*.AppImage
            electron-linux/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
