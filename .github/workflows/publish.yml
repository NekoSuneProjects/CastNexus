name: Publish Docker Image

# Push to the dashboard branch:
#   normal commit           -> stable image: :latest + main/VERSION
#   commit containing [beta] -> beta image only: :beta + <BETA_VERSION>-beta.<run>
#                              (:latest and the other images are not touched)
# Manual run (Actions -> Publish Docker Image -> Run workflow): choose channel
# beta/stable and runner auto/self-hosted/github.

on:
  push:
    branches: [dashboard]
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build (auto = self-hosted when idle, else GitHub-hosted)
        type: choice
        options: [auto, self-hosted, github]
        default: auto
      channel:
        description: beta = dashboard :beta image only (leaves :latest alone)
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write
  packages: write

jobs:
  # Pick the build machine. The self-hosted runner is shared with other
  # repositories; when it is busy or offline, a queued job would wait (and was
  # being cancelled), so build on a GitHub-hosted runner instead.
  #
  # Needs the repository/org secret RUNNER_STATUS_TOKEN: a fine-grained token
  # with "Self-hosted runners: Read" on the NekoSuneProjects organisation.
  # Without it the self-hosted runner is used, as before.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          CHOICE: ${{ github.event.inputs.runner || 'auto' }}
          ORG: ${{ github.repository_owner }}
        run: |
          SELF='["self-hosted","Linux","docker","buildx"]'
          HOSTED='"ubuntu-latest"'
          pick() { echo "runs-on=$1" >> "$GITHUB_OUTPUT"; echo "Building on: $1 ($2)"; }
          if [ "$CHOICE" = "github" ]; then pick "$HOSTED" "requested"; exit 0; fi
          if [ "$CHOICE" = "self-hosted" ]; then pick "$SELF" "requested"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then pick "$SELF" "no RUNNER_STATUS_TOKEN secret - cannot check runner status"; exit 0; fi
          RUNNERS=$(gh api "orgs/$ORG/actions/runners" --paginate 2>/dev/null || gh api "repos/${{ github.repository }}/actions/runners" --paginate 2>/dev/null || echo '{}')
          IDLE=$(echo "$RUNNERS" | jq '[.runners[]? | select(.status=="online" and .busy==false) | select([.labels[].name] as $l | ($l|index("self-hosted")) and ($l|index("docker")) and ($l|index("buildx")))] | length')
          if [ "${IDLE:-0}" -gt 0 ]; then pick "$SELF" "$IDLE idle self-hosted runner(s)"; else pick "$HOSTED" "self-hosted runner busy or offline"; fi

  docker-publish:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and channel
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANNEL_INPUT: ${{ github.event.inputs.channel }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *"[beta]"* || "$CHANNEL_INPUT" == "beta" ]]; then
            BASE=$(tr -d '[:space:]' < BETA_VERSION 2>/dev/null || true)
            [ -n "$BASE" ] || BASE=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/VERSION | tr -d '[:space:]')
            VALUE="${BASE%%-*}-beta.${{ github.run_number }}"
            echo "value=$VALUE" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/nekosuneprojects/castnexus-dashboard:beta,ghcr.io/nekosuneprojects/castnexus-dashboard:$VALUE" >> "$GITHUB_OUTPUT"
          else
            VALUE=$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/VERSION | tr -d '[:space:]')
            echo "value=$VALUE" >> "$GITHUB_OUTPUT"
            if [[ "$VALUE" == *-* ]]; then echo "channel=beta" >> "$GITHUB_OUTPUT"; else echo "channel=stable" >> "$GITHUB_OUTPUT"; fi
            echo "tags=ghcr.io/nekosuneprojects/castnexus-dashboard:latest,ghcr.io/nekosuneprojects/castnexus-dashboard:$VALUE" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing dashboard $VALUE"
      - uses: actions/setup-node@v4
        if: steps.version.outputs.channel != 'beta'
        with:
          node-version: "24"
      - name: Sync package.json/package-lock.json to this version
        if: steps.version.outputs.channel != 'beta'
        run: npm version "${{ steps.version.outputs.value }}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version
      - name: Commit version bump if it changed anything
        if: steps.version.outputs.channel != 'beta'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sync version to ${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Version already up to date."
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CASTNEXUS_REVISION=${{ github.sha }}
            CASTNEXUS_VERSION=${{ steps.version.outputs.value }}
            CASTNEXUS_CHANNEL=${{ steps.version.outputs.channel }}
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=CastNexus dashboard
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=castnexus-dashboard
          cache-to: type=gha,mode=max,scope=castnexus-dashboard
