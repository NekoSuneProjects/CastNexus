services:
  dns:
    profiles: ["vps-console"]
    environment:
      DNS_PUBLIC_MODE: "true"
      DNS_REDIRECT_IP: ${PUBLIC_IP:?PUBLIC_IP is required for VPS console mode}
      DNS_REDIRECT_IPV6: ${PUBLIC_IPV6:-}
      DNS_ALLOWED_CLIENTS: ${VPS_ALLOWED_CLIENTS:-}
      DNS_ALLOW_ANY: ${VPS_ALLOW_ANY:-false}

  dashboard:
    environment:
      # CPU-only VPS hosts need the same protection as Raspberry Pi installs.
      # These defaults keep Chromium + x264 below the point where the frame
      # pump starts backing up, while still allowing every value to be
      # overridden from .env on a stronger VPS.
      CASTNEXUS_CPU_SAFE_MODE: ${CASTNEXUS_CPU_SAFE_MODE:-auto}
      CASTNEXUS_CPU_SAFE_WIDTH: ${CASTNEXUS_CPU_SAFE_WIDTH:-960}
      CASTNEXUS_CPU_SAFE_HEIGHT: ${CASTNEXUS_CPU_SAFE_HEIGHT:-540}
      CASTNEXUS_CPU_SAFE_FPS: ${CASTNEXUS_CPU_SAFE_FPS:-20}
      CASTNEXUS_CPU_JPEG_QUALITY: ${CASTNEXUS_CPU_JPEG_QUALITY:-55}
      COMPOSITOR_WIDTH: ${COMPOSITOR_WIDTH:-960}
      COMPOSITOR_HEIGHT: ${COMPOSITOR_HEIGHT:-540}
      COMPOSITOR_FPS: ${COMPOSITOR_FPS:-20}
      COMPOSITOR_JPEG_QUALITY: ${COMPOSITOR_JPEG_QUALITY:-55}
      COMPOSITOR_VIDEO_BITRATE: ${COMPOSITOR_VIDEO_BITRATE:-2500k}
      COMPOSITOR_VIDEO_MAXRATE: ${COMPOSITOR_VIDEO_MAXRATE:-3000k}
      COMPOSITOR_VIDEO_BUFSIZE: ${COMPOSITOR_VIDEO_BUFSIZE:-5000k}
      COMPOSITOR_X264_PRESET: ${COMPOSITOR_X264_PRESET:-ultrafast}
      DESTINATION_VIDEO_BITRATE: ${DESTINATION_VIDEO_BITRATE:-3000k}
      DESTINATION_VIDEO_MAXRATE: ${DESTINATION_VIDEO_MAXRATE:-3200k}
      DESTINATION_VIDEO_BUFSIZE: ${DESTINATION_VIDEO_BUFSIZE:-6000k}
      DESTINATION_X264_PRESET: ${DESTINATION_X264_PRESET:-ultrafast}
      RTMP_INPUT_QUEUE: ${RTMP_INPUT_QUEUE:-2048}

  intercept:
    profiles: ["vps-console"]
    environment:
      INTERCEPT_MODE: vps
      VPS_ALLOWED_CLIENTS: ${VPS_ALLOWED_CLIENTS:-}
      VPS_ALLOW_ANY: ${VPS_ALLOW_ANY:-false}
      VPS_RTMP_PORT: ${VPS_RTMP_PORT:-1935}
      VPS_RTMP_WAIT_SECONDS: ${VPS_RTMP_WAIT_SECONDS:-60}
